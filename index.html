<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水质微塑料数据管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --background: #f8fafc;
            --surface: #ffffff;
        }
        
        body {
            background: linear-gradient(180deg, #eff6ff 0%, #f8fafc 280px);
            min-height: 100vh;
        }

        .modal {
            transition: opacity 0.25s ease;
        }
        body.modal-active {
            overflow: hidden;
        }
        
        .table-container {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }
        
        .table-container::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        
        .table-container::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .table-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 20px;
        }
        
        .table-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Stats Card Hover Effect */
        .stats-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .stats-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* Glassmorphism for Navbar */
        .glass-nav {
            background: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 60%, #38bdf8 130%);
            backdrop-filter: blur(8px);
        }

        /* Mobile Specific Adjustments */
        @media (max-width: 768px) {
            .nav-buttons button {
                padding: 0.45rem 0.7rem !important;
            }
            /* Modal becomes a bottom sheet */
            .modal {
                align-items: flex-end !important;
            }
            .modal-container {
                width: 100% !important;
                max-width: 100% !important;
                max-height: 92vh !important;
                margin: 0 !important;
                border-radius: 1.25rem 1.25rem 0 0 !important;
            }
            .table-container {
                -webkit-overflow-scrolling: touch;
            }
            /* Prevent iOS input focus zoom */
            input, select, textarea {
                font-size: 16px !important;
            }
        }

        /* Mobile card list replaces wide table on small screens */
        .mobile-card-list { display: none; }
        @media (max-width: 767.98px) {
            .desktop-table-wrap { display: none !important; }
            .mobile-card-list { display: block !important; }
        }

        /* Native details/summary cleanup */
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] .details-chevron { transform: rotate(180deg); }

        /* Custom Table Styling */
        .custom-table thead tr:first-child th {
            border-top: none;
        }
        .custom-table th, .custom-table td {
            border-color: #f1f5f9;
        }
        
        /* Sticky Column Shadow */
        .sticky-right {
            box-shadow: -4px 0 6px -1px rgba(0, 0, 0, 0.05);
        }

        /* Button Hover Animations */
        .btn-action {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }
        
        .btn-edit {
            color: #2563eb;
            background: #eff6ff;
            border: 1px solid #dbeafe;
        }
        
        .btn-edit:hover {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }
        
        .btn-delete {
            color: #dc2626;
            background: #fef2f2;
            border: 1px solid #fee2e2;
        }
        
        .btn-delete:hover {
            background: #dc2626;
            color: white;
            border-color: #dc2626;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
        }

        .btn-action i {
            transition: transform 0.2s ease;
        }
        
        .btn-action:hover i {
            transform: scale(1.1);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <!-- Navbar -->
    <nav class="glass-nav text-white shadow-md sticky top-0 z-40">
        <div class="max-w-[98%] mx-auto px-3 sm:px-6">
            <div class="flex items-center justify-between h-14 md:h-16">
                <div class="flex items-center space-x-2 md:space-x-3 min-w-0">
                    <div class="bg-white p-1.5 md:p-2 rounded-lg shadow-inner shrink-0">
                        <i class="lucide-droplets text-blue-600 w-5 h-5 md:w-6 md:h-6"></i>
                    </div>
                    <span class="font-extrabold text-sm sm:text-lg md:text-xl tracking-tight whitespace-nowrap truncate">水质微塑料 <span class="text-blue-200">管理系统</span></span>
                </div>
                <div class="flex items-center space-x-2 nav-buttons">
                    <input type="file" id="importInput" accept=".xlsx, .xls, .json" class="hidden" onchange="handleImport(event)">
                    <button onclick="triggerImport()" class="bg-white/10 hover:bg-white/20 text-white px-2.5 md:px-4 py-2 rounded-xl text-xs md:text-sm font-bold transition-all flex items-center border border-white/20 hover:border-white/40 shadow-sm active:scale-95 whitespace-nowrap shrink-0">
                        <i class="lucide-upload mr-1 md:mr-2 w-4 h-4"></i> <span class="hidden sm:inline">导入数据</span><span class="sm:hidden">导入</span>
                    </button>
                    <button onclick="exportData()" class="bg-white/10 hover:bg-white/20 text-white px-2.5 md:px-4 py-2 rounded-xl text-xs md:text-sm font-bold transition-all flex items-center border border-white/20 hover:border-white/40 shadow-sm active:scale-95 whitespace-nowrap shrink-0">
                        <i class="lucide-download mr-1 md:mr-2 w-4 h-4"></i> <span class="hidden sm:inline">导出 Excel</span><span class="sm:hidden">导出</span>
                    </button>
                    <div class="h-6 w-px bg-white/20 mx-0.5 md:mx-2 shrink-0"></div>
                    <button onclick="resetData()" class="bg-rose-500/90 hover:bg-rose-500 text-white px-2.5 md:px-4 py-2 rounded-xl text-xs md:text-sm font-bold transition-all shadow-lg shadow-rose-500/20 flex items-center active:scale-95 whitespace-nowrap shrink-0">
                        <i class="lucide-refresh-cw mr-1 md:mr-2 w-4 h-4"></i> <span>重置</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-[98%] mx-auto px-3 sm:px-6 py-6 md:py-8">
        <!-- Dashboard Stats -->
        <div class="grid grid-cols-3 md:grid-cols-3 gap-3 md:gap-8 mb-6 md:mb-10">
            <div class="stats-card bg-white p-3 md:p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row items-center justify-center md:justify-start text-center md:text-left gap-2 md:gap-5">
                <div class="bg-blue-50 p-2 md:p-4 rounded-xl">
                    <i class="lucide-database text-blue-500 w-5 h-5 md:w-8 md:h-8"></i>
                </div>
                <div>
                    <div class="text-slate-500 text-[10px] md:text-xs font-bold uppercase tracking-wider">总数据量</div>
                    <div class="text-xl md:text-4xl font-black text-slate-800 mt-0.5 md:mt-1" id="stat-total">0</div>
                </div>
            </div>
            <div class="stats-card bg-white p-3 md:p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row items-center justify-center md:justify-start text-center md:text-left gap-2 md:gap-5">
                <div class="bg-emerald-50 p-2 md:p-4 rounded-xl">
                    <i class="lucide-map-pin text-emerald-500 w-5 h-5 md:w-8 md:h-8"></i>
                </div>
                <div>
                    <div class="text-slate-500 text-[10px] md:text-xs font-bold uppercase tracking-wider">涉及河流</div>
                    <div class="text-xl md:text-4xl font-black text-slate-800 mt-0.5 md:mt-1" id="stat-rivers">0</div>
                </div>
            </div>
            <div class="stats-card bg-white p-3 md:p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row items-center justify-center md:justify-start text-center md:text-left gap-2 md:gap-5">
                <div class="bg-orange-50 p-2 md:p-4 rounded-xl">
                    <i class="lucide-waves text-orange-500 w-5 h-5 md:w-8 md:h-8"></i>
                </div>
                <div>
                    <div class="text-slate-500 text-[10px] md:text-xs font-bold uppercase tracking-wider">平均丰度 (n/L)</div>
                    <div class="text-xl md:text-4xl font-black text-slate-800 mt-0.5 md:mt-1" id="stat-abundance">0.00</div>
                </div>
            </div>
        </div>

        <!-- Table Controls -->
        <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center mb-6 md:mb-8 gap-3 md:gap-6">
            <div class="relative w-full md:w-[450px]">
                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                    <i class="lucide-search w-5 h-5"></i>
                </span>
                <input type="text" id="search-input" oninput="handleSearch()" class="block w-full pl-12 pr-4 py-3 bg-white border border-slate-200 rounded-xl leading-5 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all shadow-sm" placeholder="快速查找河流名称、编号或采样时期...">
            </div>
            <button onclick="openModal()" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-2xl font-black transition-all shadow-xl shadow-blue-600/20 flex items-center justify-center transform active:scale-95 group">
                <i class="lucide-plus-circle mr-2 w-5 h-5 group-hover:rotate-90 transition-transform duration-300"></i> 新增观测记录
            </button>
        </div>

        <!-- Data Table -->
        <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-200 overflow-hidden">
            <div class="desktop-table-wrap">
            <div class="table-container overflow-x-auto">
                <table class="custom-table min-w-full divide-y divide-slate-200 border-collapse">
                    <thead>
                        <tr class="bg-slate-50/80 divide-x divide-slate-200">
                            <th rowspan="2" class="px-4 py-4 text-center text-[11px] font-bold text-slate-500 uppercase tracking-wider">序号</th>
                            <th rowspan="2" class="px-4 py-4 text-center text-[11px] font-bold text-slate-500 uppercase tracking-wider">采样时期</th>
                            <th rowspan="2" class="px-4 py-4 text-center text-[11px] font-bold text-slate-500 uppercase tracking-wider">采样时间</th>
                            <th rowspan="2" class="px-4 py-4 text-center text-[11px] font-bold text-slate-500 uppercase tracking-wider">河流名称</th>
                            <th rowspan="2" class="px-4 py-4 text-center text-[11px] font-bold text-slate-500 uppercase tracking-wider">简称</th>
                            <th rowspan="2" class="px-4 py-4 text-center text-[11px] font-bold text-slate-500 uppercase tracking-wider">编号</th>
                            <th rowspan="2" class="px-4 py-4 text-center text-[11px] font-bold text-slate-500 uppercase tracking-wider">纬度</th>
                            <th rowspan="2" class="px-4 py-4 text-center text-[11px] font-bold text-slate-500 uppercase tracking-wider">经度</th>
                            <th colspan="5" class="px-4 py-2 text-center text-[11px] font-black text-blue-600 uppercase bg-blue-50/50 border-b border-slate-200 tracking-widest">塑料类型统计</th>
                            <th colspan="6" class="px-4 py-2 text-center text-[11px] font-black text-rose-600 uppercase bg-rose-50/50 border-b border-slate-200 tracking-widest">颜色统计</th>
                            <th colspan="8" class="px-4 py-2 text-center text-[11px] font-black text-emerald-600 uppercase bg-emerald-50/50 border-b border-slate-200 tracking-widest">微塑料粒径 (μm)</th>
                            <th rowspan="2" class="px-4 py-4 text-center text-[11px] font-bold text-slate-900 uppercase tracking-wider">总量</th>
                            <th rowspan="2" class="px-4 py-4 text-center text-[11px] font-bold text-slate-500 uppercase tracking-wider">容量(L)</th>
                            <th rowspan="2" class="px-4 py-4 text-center text-[11px] font-bold text-blue-700 uppercase tracking-wider bg-blue-50/30">丰度</th>
                            <th rowspan="2" class="px-4 py-4 text-center text-[11px] font-bold text-slate-900 uppercase tracking-wider sticky right-0 bg-slate-50 z-20 border-l border-slate-200 sticky-right min-w-[160px]">管理操作</th>
                        </tr>
                        <tr class="bg-slate-50/80 divide-x divide-slate-200">
                            <!-- 类型统计 -->
                            <th class="px-2 py-3 text-center text-[10px] font-bold text-blue-500 bg-blue-50/30">碎片</th>
                            <th class="px-2 py-3 text-center text-[10px] font-bold text-blue-500 bg-blue-50/30">纤维</th>
                            <th class="px-2 py-3 text-center text-[10px] font-bold text-blue-500 bg-blue-50/30">颗粒</th>
                            <th class="px-2 py-3 text-center text-[10px] font-bold text-blue-500 bg-blue-50/30">薄膜</th>
                            <th class="px-2 py-3 text-center text-[10px] font-bold text-blue-500 bg-blue-50/30">泡沫</th>
                            <!-- 颜色统计 -->
                            <th class="px-2 py-3 text-center text-[10px] font-bold text-rose-500 bg-rose-50/30">红色</th>
                            <th class="px-2 py-3 text-center text-[10px] font-bold text-rose-500 bg-rose-50/30">黑色</th>
                            <th class="px-2 py-3 text-center text-[10px] font-bold text-rose-500 bg-rose-50/30">白色</th>
                            <th class="px-2 py-3 text-center text-[10px] font-bold text-rose-500 bg-rose-50/30">透明</th>
                            <th class="px-2 py-3 text-center text-[10px] font-bold text-rose-500 bg-rose-50/30">蓝色</th>
                            <th class="px-2 py-3 text-center text-[10px] font-bold text-rose-500 bg-rose-50/30">其他</th>
                            <!-- 粒径统计 -->
                            <th class="px-2 py-3 text-center text-[10px] font-bold text-emerald-500 bg-emerald-50/30">0-50</th>
                            <th class="px-2 py-3 text-center text-[10px] font-bold text-emerald-500 bg-emerald-50/30">50-100</th>
                            <th class="px-2 py-3 text-center text-[10px] font-bold text-emerald-500 bg-emerald-50/30">100-300</th>
                            <th class="px-2 py-3 text-center text-[10px] font-bold text-emerald-500 bg-emerald-50/30">300-500</th>
                            <th class="px-2 py-3 text-center text-[10px] font-bold text-emerald-500 bg-emerald-50/30">500-1k</th>
                            <th class="px-2 py-3 text-center text-[10px] font-bold text-emerald-500 bg-emerald-50/30">1k-2k</th>
                            <th class="px-2 py-3 text-center text-[10px] font-bold text-emerald-500 bg-emerald-50/30">2k-3k</th>
                            <th class="px-2 py-3 text-center text-[10px] font-bold text-emerald-500 bg-emerald-50/30">3k-5k</th>
                        </tr>
                    </thead>
                    <tbody id="data-table-body" class="bg-white divide-y divide-slate-100 text-[12px]">
                        <!-- Data rows will be inserted here -->
                    </tbody>
                </table>
            </div>
            </div>
            <!-- Mobile Card List (rendered by JS, shown < 768px) -->
            <div id="mobile-card-list" class="mobile-card-list p-3 pt-4"></div>
            <!-- Pagination -->
            <div class="bg-slate-50/50 px-4 md:px-8 py-4 md:py-5 flex flex-col sm:flex-row justify-between items-center gap-3 border-t border-slate-100">
                <div id="table-info" class="text-xs md:text-sm font-bold text-slate-400 uppercase tracking-widest text-center sm:text-left"></div>
                <div class="flex items-center justify-center space-x-3">
                    <button onclick="prevPage()" class="px-4 sm:px-5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-black text-slate-600 hover:bg-slate-50 hover:border-slate-300 disabled:opacity-30 disabled:cursor-not-allowed transition-all shadow-sm flex items-center active:scale-95" id="btn-prev">
                        <i class="lucide-arrow-left mr-2 w-4 h-4"></i> 上一页
                    </button>
                    <button onclick="nextPage()" class="px-4 sm:px-5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-black text-slate-600 hover:bg-slate-50 hover:border-slate-300 disabled:opacity-30 disabled:cursor-not-allowed transition-all shadow-sm flex items-center active:scale-95" id="btn-next">
                        下一页 <i class="lucide-arrow-right ml-2 w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal for Create/Edit -->
    <div id="modal" class="modal fixed w-full h-full top-0 left-0 flex items-center justify-center hidden z-50">
        <div class="modal-overlay absolute w-full h-full bg-slate-900/60 backdrop-blur-sm"></div>
        <div class="modal-container bg-white w-full max-w-5xl mx-auto rounded-3xl shadow-2xl z-50 overflow-hidden max-h-[95vh] flex flex-col">
            <!-- Modal Header -->
            <div class="px-4 md:px-8 py-4 md:py-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50 shrink-0">
                <div>
                    <h3 class="text-lg md:text-2xl font-black text-slate-800" id="modal-title">新增数据</h3>
                    <p class="text-slate-500 text-xs mt-1 font-medium hidden sm:block">请填写下方详细的水质观测指标数据</p>
                </div>
                <button onclick="closeModal()" class="p-2 hover:bg-white hover:shadow-sm rounded-xl transition-all text-slate-400 hover:text-slate-600 shrink-0">
                    <i class="lucide-x w-6 h-6"></i>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="overflow-y-auto flex-1 p-4 md:p-8 overscroll-contain">
                <form id="data-form" onsubmit="handleSubmit(event)" class="space-y-6 md:space-y-10">
                    <input type="hidden" id="field-id">

                    <!-- 基本信息 -->
                    <section>
                        <div class="flex items-center space-x-2 mb-4 md:mb-6">
                            <div class="w-1.5 h-6 bg-blue-500 rounded-full"></div>
                            <h4 class="text-sm font-black text-slate-800 uppercase tracking-wider">观测基本信息</h4>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-6">
                            <div class="space-y-1.5">
                                <label class="text-[11px] font-bold text-slate-500 uppercase ml-1">采样时期</label>
                                <input type="text" id="field-period" class="block w-full bg-slate-50 border-none focus:ring-2 focus:ring-blue-500/20 rounded-xl py-2.5 px-4 text-sm font-medium transition-all" required placeholder="如：丰水期">
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-[11px] font-bold text-slate-500 uppercase ml-1">采样时间</label>
                                <input type="text" id="field-sampling_time" class="block w-full bg-slate-50 border-none focus:ring-2 focus:ring-blue-500/20 rounded-xl py-2.5 px-4 text-sm font-medium transition-all" placeholder="如：23年7月">
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-[11px] font-bold text-slate-500 uppercase ml-1">河流名称</label>
                                <input type="text" id="field-rive_name" class="block w-full bg-slate-50 border-none focus:ring-2 focus:ring-blue-500/20 rounded-xl py-2.5 px-4 text-sm font-medium transition-all" required placeholder="输入河流全称">
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-[11px] font-bold text-slate-500 uppercase ml-1">编号</label>
                                <input type="text" id="field-river_number" class="block w-full bg-slate-50 border-none focus:ring-2 focus:ring-blue-500/20 rounded-xl py-2.5 px-4 text-sm font-medium transition-all" required placeholder="观测点编号">
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-[11px] font-bold text-slate-500 uppercase ml-1">纬度</label>
                                <input type="number" step="0.000001" id="field-latitude" class="block w-full bg-slate-50 border-none focus:ring-2 focus:ring-blue-500/20 rounded-xl py-2.5 px-4 text-sm font-medium transition-all">
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-[11px] font-bold text-slate-500 uppercase ml-1">经度</label>
                                <input type="number" step="0.000001" id="field-longitude" class="block w-full bg-slate-50 border-none focus:ring-2 focus:ring-blue-500/20 rounded-xl py-2.5 px-4 text-sm font-medium transition-all">
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-[11px] font-bold text-slate-500 uppercase ml-1">水样容量 (L)</label>
                                <input type="number" step="0.1" id="field-water_volume" class="block w-full bg-slate-50 border-none focus:ring-2 focus:ring-blue-500/20 rounded-xl py-2.5 px-4 text-sm font-medium transition-all" required>
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-[11px] font-bold text-slate-500 uppercase ml-1">简称</label>
                                <input type="text" id="field-rive_abbreviation" class="block w-full bg-slate-50 border-none focus:ring-2 focus:ring-blue-500/20 rounded-xl py-2.5 px-4 text-sm font-medium transition-all">
                            </div>
                        </div>
                    </section>

                    <div class="grid grid-cols-1 gap-8 md:gap-10 lg:grid-cols-2">
                        <!-- 类型统计 -->
                        <section>
                            <div class="flex items-center space-x-2 mb-4 md:mb-6">
                                <div class="w-1.5 h-6 bg-rose-400 rounded-full"></div>
                                <h4 class="text-sm font-black text-slate-800 uppercase tracking-wider">塑料类型统计</h4>
                            </div>
                            <div class="grid grid-cols-3 gap-2 sm:gap-4">
                                <div class="p-2.5 sm:p-4 bg-slate-50 rounded-2xl space-y-2">
                                    <label class="text-[10px] font-black text-slate-400 uppercase">碎片</label>
                                    <input type="number" id="field-plastics_splinter_type" class="block w-full bg-white border-none rounded-lg py-1.5 px-3 text-sm font-bold shadow-sm focus:ring-2 focus:ring-rose-200 transition-all">
                                </div>

            filteredData = data.filter(item => 
                (item.rive_name || '').toLowerCase().includes(query) ||
                (item.river_number || '').toLowerCase().includes(query) ||
                (item.period || '').toLowerCase().includes(query)
            );
            currentPage = 1;
            renderTable();
        }

            if (currentPage > 1) {
                currentPage--;

            if (currentPage * itemsPerPage < filteredData.length) {
                currentPage++;

            }

            };

            const fields = [
                'period', 'sampling_time', 'rive_name', 'rive_abbreviation', 'river_number', 
                'latitude', 'longitude', 'plastics_total', 'water_volume', 'plastics_abundance',

                'one_thousand_radius', 'two_thousand_radius', 'three_thousand_radius',
                'five_thousand_radius'
            ];

            fields.forEach(field => {
                const el = document.getElementById(`field-${field}`);
                if (el) {
                    newItem[field] = el.type === 'number' ? parseFloat(el.value || 0) : el.value;
                }

            if (id) {
                const index = data.findIndex(i => i.id === parseInt(id));
                data[index] = newItem;
            } else {
                data.unshift(newItem);
            }

            saveToLocalStorage();
            closeModal();
            handleSearch();
            updateStats();

        async function handleImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            const fileName = file.name.toLowerCase();

            reader.onload = async (e) => {
                try {
                    let importedData = [];
                    if (fileName.endsWith('.json')) {
                        importedData = JSON.parse(e.target.result);
                    } else if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls')) {
                        if (typeof XLSX === 'undefined') {
                            alert('Excel 解析库尚未加载，请稍后再试。');
                            return;
                        }
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const rawData = XLSX.utils.sheet_to_json(worksheet);

                        // Map headers back
                        const reverseHeadersMap = {
                            '采样时期': 'period',
                            '采样时间': 'sampling_time',
                            '河流名称': 'rive_name',
                            '河流简称': 'rive_abbreviation',
                            '河流编号': 'river_number',
                            '纬度': 'latitude',

                            '红色塑料': 'plastics_red_color',
                            '黑色塑料': 'plastics_black_color',
                            '白色塑料': 'plastics_white_color',
                            '透明塑料': 'plastics_transparent_color',
                            '蓝色塑料': 'plastics_blue_color',
                            '其他颜色塑料': 'plastics_other_color',
                            '微塑料粒径(0-50)': 'fifty_radius',
                            '微塑料粒径(50-100)': 'one_hundred_radius',
                            '微塑料粒径(100-300)': 'three_hundred_radius',
                            '微塑料粒径(300-500)': 'five_hundred_radius',
                            '微塑料粒径(500-1000)': 'one_thousand_radius',
                            '微塑料粒径(1000-2000)': 'two_thousand_radius',
                            '微塑料粒径(2000-3000)': 'three_thousand_radius',
                            '微塑料粒径(3000-5000)': 'five_thousand_radius',
                            '微塑料总量': 'plastics_total',
                            '水样容量(L)': 'water_volume',
                            '微塑料丰度(n/l)': 'plastics_abundance',
                            '微塑料丰度': 'plastics_abundance'
                        };

                        importedData = rawData.map(row => {
                            const item = {};
                            Object.keys(row).forEach(header => {
                                const key = reverseHeadersMap[header.trim()];
                                if (key) {
                                    let value = row[header];
                                    // Basic type conversion
                                    if (['latitude', 'longitude', 'plastics_splinter_type', 'plastics_fibre_type', 'plastics_grain_type', 'plastics_membrane_type', 'plastics_foam_type', 'plastics_red_color', 'plastics_black_color', 'plastics_white_color', 'plastics_transparent_color', 'plastics_blue_color', 'plastics_other_color', 'fifty_radius', 'one_hundred_radius', 'three_hundred_radius', 'five_hundred_radius', 'one_thousand_radius', 'two_thousand_radius', 'three_thousand_radius', 'five_thousand_radius', 'plastics_total', 'water_volume', 'plastics_abundance'].includes(key)) {
                                        value = parseFloat(value) || 0;
                                    }
                                    item[key] = value;
                                }
                            });
                            return item;
                        });
                    }

                    if (importedData.length === 0) {
                        alert('未在文件中找到有效数据。');
                        return;
                    }

                    if (confirm(`成功解析 ${importedData.length} 条数据。是否要追加到当前数据中？\n(取消将替换所有当前数据)`)) {
                        // Append
                        const maxId = data.length > 0 ? Math.max(...data.map(d => d.id)) : 0;
                        const newData = importedData.map((d, i) => ({ ...d, id: maxId + i + 1 }));
                        data = [...data, ...newData];
                    } else {
                        // Replace
                        data = importedData.map((d, i) => ({ ...d, id: i + 1 }));
                    }

                    saveToLocalStorage();
                    handleSearch();
                    updateStats();
                    alert('数据导入成功！');
                } catch (error) {
                    console.error('Import failed:', error);
                    alert('导入失败: ' + error.message);
                }
                event.target.value = ''; // Reset input
            };

            if (fileName.endsWith('.json')) {
                reader.readAsText(file);
            } else {
                reader.readAsArrayBuffer(file);
            }
        }

        function exportData() {
            try {
                if (typeof XLSX === 'undefined') {
                    console.error('XLSX library not loaded');
                    alert('Excel 导出库尚未加载，请检查网络连接或稍后再试。');
                    return;
                }

                // Prepare headers mapping
                const headersMap = {
                    period: '采样时期',
                    sampling_time: '采样时间',
                    rive_name: '河流名称',
                    rive_abbreviation: '河流简称',
                    river_number: '河流编号',
                    latitude: '纬度',
                    longitude: '经度',
                    plastics_splinter_type: '塑料碎片类型',
                    plastics_fibre_type: '塑料纤维类型',
                    plastics_grain_type: '塑料颗粒类型',
                    plastics_membrane_type: '塑料薄膜类型',
                    plastics_foam_type: '塑料泡沫类型',
                    plastics_red_color: '红色塑料',
                    plastics_black_color: '黑色塑料',
                    plastics_white_color: '白色塑料',
                    plastics_transparent_color: '透明塑料',
                    plastics_blue_color: '蓝色塑料',
                    plastics_other_color: '其他颜色塑料',
                    fifty_radius: '微塑料粒径(0-50)',
                    one_hundred_radius: '微塑料粒径(50-100)',
                    three_hundred_radius: '微塑料粒径(100-300)',
                    five_hundred_radius: '微塑料粒径(300-500)',
                    one_thousand_radius: '微塑料粒径(500-1000)',
                    two_thousand_radius: '微塑料粒径(1000-2000)',
                    three_thousand_radius: '微塑料粒径(2000-3000)',
                    five_thousand_radius: '微塑料粒径(3000-5000)',
                    plastics_total: '微塑料总量',
                    water_volume: '水样容量(L)',
                    plastics_abundance: '微塑料丰度(n/l)'
                };

                // Format data for Excel
                const excelData = data.map((item, index) => {
                    const row = { '序号': index + 1 };
                    Object.keys(headersMap).forEach(key => {
                        row[headersMap[key]] = item[key] ?? '';
                    });
                    return row;
                });

                // Create worksheet
                const ws = XLSX.utils.json_to_sheet(excelData);
                
                // Create workbook
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "水质数据");

                // Generate safe filename
                const now = new Date();
                const dateStr = `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2, '0')}-${now.getDate().toString().padStart(2, '0')}`;
                
                // Download file
                XLSX.writeFile(wb, `水质微塑料数据_${dateStr}.xlsx`);
            } catch (error) {
                console.error('Export failed:', error);
                alert('导出失败: ' + error.message);
            }
        }

        function resetData() {
            if (confirm('确定要重置所有数据到初始状态吗？这将清除您的所有更改。')) {
                data = [...INITIAL_DATA];
                saveToLocalStorage();
                handleSearch();
                updateStats();
            }
        }

        // Run Init
        init();
    </script>
</body>
</html>
